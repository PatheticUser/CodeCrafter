[project]
name = "codecrafter"
version = "3.0.0"
description = "AI-powered coding assistant with multi-language execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "openai>=2.30.0",
    "pydantic-settings",
    "pygame>=2.6.1",
    "python-docx>=1.1.0",
    "requests>=2.34.1",
    "sse-starlette>=3.4.4",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
codecrafter = "src.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
