<title>CodeCrafter Architecture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg:        #0d1117;
    --bg-panel:  #161b22;
    --bg-card:   #1c2333;
    --bg-hover:  #243044;
    --border:    #2a3548;
    --border-hi: #3b4f6b;
    --text:      #e6edf3;
    --text-dim:  #8b949e;
    --text-mute: #484f58;
    --accent:    #58a6ff;
    --accent2:   #7ee787;
    --accent3:   #f0883e;
    --accent4:   #d2a8ff;
    --danger:    #ff7b72;
    --node-cli:  #1a3a5c;
    --node-api:  #1a3f2d;
    --node-core: #2d1f4a;
    --node-tool: #3a2b0f;
    --node-ext:  #3a1515;
    --node-inf:  #1a3a5c;
    --node-sec:  #2a2d12;
    --flow-color:#58a6ff;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:        #f0f4f8;
      --bg-panel:  #ffffff;
      --bg-card:   #f6f9fc;
      --bg-hover:  #e8eef5;
      --border:    #d0d7de;
      --border-hi: #8ab4d8;
      --text:      #1f2328;
      --text-dim:  #656d76;
      --text-mute: #adb5bd;
      --accent:    #0969da;
      --accent2:   #1a7f37;
      --accent3:   #bc4c00;
      --accent4:   #8250df;
      --danger:    #d1242f;
      --node-cli:  #dbeafe;
      --node-api:  #dcfce7;
      --node-core: #f3e8ff;
      --node-tool: #fef3c7;
      --node-ext:  #fee2e2;
      --node-inf:  #dbeafe;
      --node-sec:  #fefce8;
      --flow-color:#0969da;
    }
  }

  :root[data-theme="dark"] {
    --bg:        #0d1117;
    --bg-panel:  #161b22;
    --bg-card:   #1c2333;
    --bg-hover:  #243044;
    --border:    #2a3548;
    --border-hi: #3b4f6b;
    --text:      #e6edf3;
    --text-dim:  #8b949e;
    --text-mute: #484f58;
    --accent:    #58a6ff;
    --accent2:   #7ee787;
    --accent3:   #f0883e;
    --accent4:   #d2a8ff;
    --danger:    #ff7b72;
    --node-cli:  #1a3a5c;
    --node-api:  #1a3f2d;
    --node-core: #2d1f4a;
    --node-tool: #3a2b0f;
    --node-ext:  #3a1515;
    --node-inf:  #1a3a5c;
    --node-sec:  #2a2d12;
    --flow-color:#58a6ff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 100;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 15px;
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  .logo span { color: var(--text-dim); font-weight: 400; }

  .version-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 2px 7px;
    border-radius: 12px;
  }

  .header-controls { display: flex; align-items: center; gap: 8px; }

  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border-hi); }
  .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── Legend ── */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    padding: 10px 20px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
  }

  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* ── Main layout ── */
  .app { display: flex; flex: 1; overflow: hidden; }

  /* ── Diagram panel ── */
  .diagram-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
    cursor: grab;
  }
  .diagram-wrap.grabbing { cursor: grabbing; }

  svg#arch {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ── Side panel ── */
  .side-panel {
    width: 320px;
    flex-shrink: 0;
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.2s;
  }
  .side-panel.collapsed { width: 0; border-left: none; }

  .side-panel-inner {
    padding: 20px;
    overflow-y: auto;
    flex: 1;
  }

  .panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 400;
  }

  .panel-subtitle {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
  }

  .panel-section { margin-bottom: 16px; }

  .panel-section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-mute);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .panel-section p {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .file-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 4px;
    margin: 2px 2px 2px 0;
  }

  .pill-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

  .pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    background: var(--bg-card);
  }

  .dep-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-dim);
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  .dep-item:last-child { border-bottom: none; }
  .dep-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  .empty-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 8px;
    color: var(--text-mute);
    font-size: 12px;
    text-align: center;
    padding: 20px;
  }
  .empty-panel svg { opacity: 0.3; }

  /* ── Flow mode ── */
  .flow-step-bar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .flow-step-bar.visible { display: flex; }

  .flow-label {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .flow-step-dots { display: flex; gap: 5px; align-items: center; }
  .flow-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
  }
  .flow-dot.active { background: var(--flow-color); transform: scale(1.4); }
  .flow-dot.done { background: var(--accent2); }

  .flow-desc {
    font-size: 12px;
    color: var(--text);
    flex: 1;
    min-width: 140px;
  }

  /* ── Zoom controls ── */
  .zoom-controls {
    position: absolute;
    bottom: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 10;
  }

  .zoom-btn {
    width: 30px; height: 30px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    line-height: 1;
  }
  .zoom-btn:hover { background: var(--bg-hover); }

  /* ── SVG node styles (set via JS but also useful as fallback) ── */
  .node-group { cursor: pointer; }

  .node-group rect.node-bg {
    rx: 8;
    transition: filter 0.15s;
  }
  .node-group:hover rect.node-bg {
    filter: brightness(1.3);
  }
  .node-group.highlighted rect.node-bg {
    stroke-width: 2;
  }
  .node-group.dimmed { opacity: 0.25; }

  .node-label {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12px;
    fill: var(--text);
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: central;
  }

  .node-sublabel {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    fill: var(--text-dim);
    pointer-events: none;
    text-anchor: middle;
  }

  .edge {
    fill: none;
    stroke: var(--border-hi);
    stroke-width: 1.5;
    marker-end: url(#arrowhead);
  }
  .edge.primary {
    stroke: var(--flow-color);
    stroke-width: 2;
    opacity: 0.85;
  }
  .edge.highlighted {
    stroke: var(--accent3);
    stroke-width: 2.5;
    opacity: 1;
  }
  .edge.dimmed { opacity: 0.08; }

  .edge-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    fill: var(--text-mute);
    text-anchor: middle;
  }

  .cluster-rect {
    fill: none;
    stroke: var(--border);
    stroke-width: 1;
    stroke-dasharray: 4 3;
    rx: 10;
  }

  .cluster-label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    fill: var(--text-mute);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  /* ── Responsive collapse ── */
  @media (max-width: 700px) {
    .side-panel { display: none; }
    .side-panel.mobile-open { display: flex; position: fixed; right: 0; top: 0; bottom: 0; width: min(320px, 100vw); z-index: 200; }
    .legend { display: none; }
  }
</style>

<header>
  <div class="header-left">
    <div class="logo">CodeCrafter <span>/ Runtime Architecture</span></div>
    <div class="version-badge">v3.0.0</div>
  </div>
  <div class="header-controls">
    <button class="btn" id="btnFlow">▶ Trace Flow</button>
    <button class="btn" id="btnReset">Reset View</button>
    <button class="btn" id="btnPanel">Hide Panel</button>
  </div>
</header>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#1a3a5c;border-color:#58a6ff;"></div>CLI / Entry</div>
  <div class="legend-item"><div class="legend-dot" style="background:#1a3f2d;border-color:#7ee787;"></div>API / FastAPI</div>
  <div class="legend-item"><div class="legend-dot" style="background:#2d1f4a;border-color:#d2a8ff;"></div>Core Agent</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3a2b0f;border-color:#f0883e;"></div>Tools</div>
  <div class="legend-item"><div class="legend-dot" style="background:#2a2d12;border-color:#e3b341;"></div>Security</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3a1515;border-color:#ff7b72;"></div>External</div>
  <div class="legend-item">
    <svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#58a6ff" stroke-width="2"/><polygon points="18,1 24,4 18,7" fill="#58a6ff"/></svg>
    Primary path
  </div>
</div>

<div class="app">
  <div class="diagram-wrap" id="diagramWrap">
    <svg id="arch" viewBox="0 0 1100 700" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="var(--border-hi)"/>
        </marker>
        <marker id="arrowhead-primary" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="var(--flow-color)"/>
        </marker>
        <marker id="arrowhead-hi" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="var(--accent3)"/>
        </marker>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Cluster: Entry Points -->
      <rect class="cluster-rect" x="18" y="16" width="300" height="180"/>
      <text class="cluster-label" x="28" y="30">Entry Points</text>

      <!-- Cluster: Core -->
      <rect class="cluster-rect" x="360" y="16" width="380" height="300"/>
      <text class="cluster-label" x="370" y="30">Core Runtime</text>

      <!-- Cluster: Tools -->
      <rect class="cluster-rect" x="360" y="340" width="380" height="340"/>
      <text class="cluster-label" x="370" y="355">Tool Layer</text>

      <!-- Cluster: External -->
      <rect class="cluster-rect" x="770" y="16" width="314" height="300"/>
      <text class="cluster-label" x="780" y="30">External Services</text>

      <!-- ── Nodes ── -->

      <!-- N1: CLI Entry (main.py) -->
      <g class="node-group" id="n-cli" data-id="cli">
        <rect class="node-bg" x="30" y="50" width="140" height="56" rx="8"
              fill="var(--node-cli)" stroke="#58a6ff" stroke-width="1.5"/>
        <text class="node-label" x="100" y="72">main.py</text>
        <text class="node-sublabel" x="100" y="88">CLI Entry · uv run main.py</text>
      </g>

      <!-- N2: src/cli/main.py (refactored CLI) -->
      <g class="node-group" id="n-cli2" data-id="cli2">
        <rect class="node-bg" x="190" y="50" width="118" height="56" rx="8"
              fill="var(--node-cli)" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4 3"/>
        <text class="node-label" x="249" y="72">src/cli/main.py</text>
        <text class="node-sublabel" x="249" y="88">Refactored CLI</text>
      </g>

      <!-- N3: FastAPI (src/api/app.py) -->
      <g class="node-group" id="n-api" data-id="api">
        <rect class="node-bg" x="30" y="130" width="140" height="56" rx="8"
              fill="var(--node-api)" stroke="#7ee787" stroke-width="1.5"/>
        <text class="node-label" x="100" y="152">FastAPI</text>
        <text class="node-sublabel" x="100" y="168">src/api/app.py · Cloud Run</text>
      </g>

      <!-- N4: AgentLoop -->
      <g class="node-group" id="n-agent" data-id="agent">
        <rect class="node-bg" x="372" y="50" width="160" height="64" rx="8"
              fill="var(--node-core)" stroke="#d2a8ff" stroke-width="2"/>
        <text class="node-label" x="452" y="74">AgentLoop</text>
        <text class="node-sublabel" x="452" y="92">src/core/agent.py</text>
      </g>

      <!-- N5: InferenceClient / GeminiClient -->
      <g class="node-group" id="n-inf" data-id="inf">
        <rect class="node-bg" x="555" y="50" width="170" height="64" rx="8"
              fill="var(--node-inf)" stroke="#58a6ff" stroke-width="1.5"/>
        <text class="node-label" x="640" y="74">GeminiClient</text>
        <text class="node-sublabel" x="640" y="92">src/core/api_manager.py</text>
      </g>

      <!-- N6: Settings -->
      <g class="node-group" id="n-settings" data-id="settings">
        <rect class="node-bg" x="372" y="140" width="130" height="50" rx="8"
              fill="var(--node-core)" stroke="#d2a8ff" stroke-width="1"/>
        <text class="node-label" x="437" y="162">Settings</text>
        <text class="node-sublabel" x="437" y="177">src/core/settings.py</text>
      </g>

      <!-- N7: WorkspaceScanner -->
      <g class="node-group" id="n-ws" data-id="ws">
        <rect class="node-bg" x="520" y="140" width="145" height="50" rx="8"
              fill="var(--node-core)" stroke="#d2a8ff" stroke-width="1"/>
        <text class="node-label" x="592" y="162">WorkspaceScanner</text>
        <text class="node-sublabel" x="592" y="177">core/workspace.py</text>
      </g>

      <!-- N8: ToolRegistry -->
      <g class="node-group" id="n-registry" data-id="registry">
        <rect class="node-bg" x="372" y="220" width="145" height="56" rx="8"
              fill="var(--node-core)" stroke="#d2a8ff" stroke-width="1.5"/>
        <text class="node-label" x="444" y="244">ToolRegistry</text>
        <text class="node-sublabel" x="444" y="260">src/tools/registry.py</text>
      </g>

      <!-- N9: SecurityModule -->
      <g class="node-group" id="n-sec" data-id="sec">
        <rect class="node-bg" x="535" y="220" width="155" height="56" rx="8"
              fill="var(--node-sec)" stroke="#e3b341" stroke-width="1.5"/>
        <text class="node-label" x="612" y="244">PathSecurity</text>
        <text class="node-sublabel" x="612" y="260">functions/_security.py</text>
      </g>

      <!-- N10: Tools cluster (inside tool layer) -->
      <!-- File Tools -->
      <g class="node-group" id="n-filetools" data-id="filetools">
        <rect class="node-bg" x="372" y="375" width="155" height="70" rx="8"
              fill="var(--node-tool)" stroke="#f0883e" stroke-width="1.5"/>
        <text class="node-label" x="449" y="400">File Tools</text>
        <text class="node-sublabel" x="449" y="415">write · edit · read</text>
        <text class="node-sublabel" x="449" y="428">delete · outline · search</text>
      </g>

      <!-- Exec Tools -->
      <g class="node-group" id="n-exectools" data-id="exectools">
        <rect class="node-bg" x="545" y="375" width="155" height="70" rx="8"
              fill="var(--node-tool)" stroke="#f0883e" stroke-width="1.5"/>
        <text class="node-label" x="622" y="400">Exec Tools</text>
        <text class="node-sublabel" x="622" y="415">run_code · run_command</text>
        <text class="node-sublabel" x="622" y="428">15+ languages</text>
      </g>

      <!-- N11: Workspace (fs) -->
      <g class="node-group" id="n-fss" data-id="fss">
        <rect class="node-bg" x="420" y="490" width="195" height="50" rx="8"
              fill="var(--node-sec)" stroke="#e3b341" stroke-width="1"/>
        <text class="node-label" x="517" y="512">workspace/ (sandbox)</text>
        <text class="node-sublabel" x="517" y="527">path-traversal protected</text>
      </g>

      <!-- N12: Session Store -->
      <g class="node-group" id="n-sessions" data-id="sessions">
        <rect class="node-bg" x="420" y="570" width="195" height="50" rx="8"
              fill="var(--node-sec)" stroke="#e3b341" stroke-width="1"/>
        <text class="node-label" x="517" y="592">sessions/ (JSON)</text>
        <text class="node-sublabel" x="517" y="607">conversation history</text>
      </g>

      <!-- External: Google Gemini -->
      <g class="node-group" id="n-gemini" data-id="gemini">
        <rect class="node-bg" x="782" y="50" width="150" height="64" rx="8"
              fill="var(--node-ext)" stroke="#ff7b72" stroke-width="1.5"/>
        <text class="node-label" x="857" y="74">Google Gemini</text>
        <text class="node-sublabel" x="857" y="92">generativelanguage API</text>
      </g>

      <!-- External: Ollama (legacy) -->
      <g class="node-group" id="n-ollama" data-id="ollama">
        <rect class="node-bg" x="782" y="140" width="150" height="56" rx="8"
              fill="var(--node-ext)" stroke="#ff7b72" stroke-width="1" stroke-dasharray="4 3"/>
        <text class="node-label" x="857" y="163">Ollama (legacy)</text>
        <text class="node-sublabel" x="857" y="178">core/api_manager.py</text>
      </g>

      <!-- External: Cloud Run -->
      <g class="node-group" id="n-cloudrun" data-id="cloudrun">
        <rect class="node-bg" x="782" y="220" width="150" height="56" rx="8"
              fill="var(--node-ext)" stroke="#ff7b72" stroke-width="1.5"/>
        <text class="node-label" x="857" y="244">Cloud Run</text>
        <text class="node-sublabel" x="857" y="260">Dockerfile · cloudbuild.yaml</text>
      </g>

      <!-- ── Edges ── -->

// ── Pan / Zoom ─────────────────────────────────────────────────────────────────

function applyTransform() {
  const g = svg.querySelector('#transformGroup');
  if (g) g.setAttribute('transform', `translate(${panX},${panY}) scale(${zoom})`);
}

function wrapSVGContent() {
  const children = Array.from(svg.children).filter(el => el.tagName !== 'defs');
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.id = 'transformGroup';
  children.forEach(c => g.appendChild(c));
  svg.appendChild(g);
}
wrapSVGContent();

wrap.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  isPanning = true;
  lastMX = e.clientX; lastMY = e.clientY;
  wrap.classList.add('grabbing');
});
window.addEventListener('mousemove', e => {
  if (!isPanning) return;
  panX += e.clientX - lastMX;
  panY += e.clientY - lastMY;
  lastMX = e.clientX; lastMY = e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  isPanning = false;
  wrap.classList.remove('grabbing');
});

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.91;
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  panX = mx - (mx - panX) * factor;
  panY = my - (my - panY) * factor;
  zoom = Math.max(0.25, Math.min(3, zoom * factor));
  applyTransform();
}, { passive: false });

// Touch pan
let lastTouches = [];
wrap.addEventListener('touchstart', e => { lastTouches = Array.from(e.touches); });
wrap.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && lastTouches.length === 1) {
    panX += e.touches[0].clientX - lastTouches[0].clientX;
    panY += e.touches[0].clientY - lastTouches[0].clientY;
    applyTransform();
  }
  lastTouches = Array.from(e.touches);
}, { passive: false });

document.getElementById('zoomIn').onclick = () => {
  zoom = Math.min(3, zoom * 1.2); applyTransform();
};
document.getElementById('zoomOut').onclick = () => {
  zoom = Math.max(0.25, zoom / 1.2); applyTransform();
};
document.getElementById('zoomFit').onclick = () => {
  zoom = 1; panX = 0; panY = 0; applyTransform();
};
document.getElementById('btnReset').onclick = () => {
  zoom = 1; panX = 0; panY = 0; applyTransform();

};

  fss:      ['sessions', 'filetools', 'exectools', 'ws'],
  sessions: ['fss'],
  gemini:   ['inf'],
  ollama:   ['inf'],
  cloudrun: ['api'],
};

document.querySelectorAll('.node-group').forEach(g => {
  g.addEventListener('click', e => {
    e.stopPropagation();
    if (flowMode) return;
    const id = g.dataset.id;
    if (selectedNode === id) { clearSelection(); return; }
    selectedNode = id;

    const related = new Set([id, ...(ADJACENCY[id] || [])]);
    document.querySelectorAll('.node-group').forEach(n => {
      n.classList.toggle('dimmed', !related.has(n.dataset.id));
      n.classList.toggle('highlighted', n.dataset.id === id);
    });
    document.querySelectorAll('.edge').forEach(ed => {
      const isRelated = Array.from(ed.classList).some(c => c.includes('primary') || c.includes('highlighted'));
      ed.classList.add('dimmed');
    });

    showDetail(id);
    if (window.innerWidth <= 700) {
      sidePanel.classList.add('mobile-open');
    }
  });
});

wrap.addEventListener('click', e => {
  if (e.target === wrap || e.target === svg) clearSelection();
});

// ── Flow mode ──────────────────────────────────────────────────────────────────

function buildFlowDots() {
  flowDots.innerHTML = '';
  FLOW_STEPS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'flow-dot';
    d.onclick = () => goToFlowStep(i);
    flowDots.appendChild(d);
  });
}

function updateFlowDots() {
  flowDots.querySelectorAll('.flow-dot').forEach((d, i) => {
    d.classList.toggle('active', i === flowStep);
    d.classList.toggle('done', i < flowStep);
  });
}

function applyFlowStep(step) {
  const s = FLOW_STEPS[step];
  flowDesc.textContent = s.desc;

  const highlighted = new Set(s.highlight.map(id => id.replace('n-', '')));
  document.querySelectorAll('.node-group').forEach(n => {
    n.classList.toggle('highlighted', highlighted.has(n.dataset.id));
    n.classList.toggle('dimmed', !highlighted.has(n.dataset.id));
  });

  document.querySelectorAll('.edge').forEach(ed => {
    ed.classList.remove('highlighted');
    ed.classList.add('dimmed');
  });
  s.edges.forEach(eid => {
    const el = document.getElementById(eid);
    if (el) { el.classList.remove('dimmed'); el.classList.add('highlighted'); }
  });

  // Show detail for first highlighted node
  if (s.highlight.length > 0) {
    const id = s.highlight[0].replace('n-', '');
    showDetail(id);
  }
  updateFlowDots();
}

function goToFlowStep(n) {
  flowStep = Math.max(0, Math.min(FLOW_STEPS.length - 1, n));
  applyFlowStep(flowStep);
}

function enterFlow() {
  flowMode = true;
  flowStep = 0;
  flowBar.classList.add('visible');
  document.getElementById('btnFlow').textContent = '◼ Stop Flow';
  document.getElementById('btnFlow').classList.add('active');
  buildFlowDots();
  applyFlowStep(0);
}

function exitFlow() {
  flowMode = false;
  flowBar.classList.remove('visible');
  document.getElementById('btnFlow').textContent = '▶ Trace Flow';
  document.getElementById('btnFlow').classList.remove('active');
  clearSelection();
}

document.getElementById('btnFlow').onclick = () => flowMode ? exitFlow() : enterFlow();
document.getElementById('btnFlowNext').onclick = () => goToFlowStep(flowStep + 1);
document.getElementById('btnFlowPrev').onclick = () => goToFlowStep(flowStep - 1);
document.getElementById('btnFlowStop').onclick = exitFlow;

// Keyboard
window.addEventListener('keydown', e => {
  if (flowMode) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goToFlowStep(flowStep + 1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goToFlowStep(flowStep - 1);
    if (e.key === 'Escape') exitFlow();
  } else {
    if (e.key === 'Escape') clearSelection();
  }
});

// ── Panel toggle ───────────────────────────────────────────────────────────────

let panelOpen = true;
document.getElementById('btnPanel').onclick = () => {
  panelOpen = !panelOpen;
  sidePanel.classList.toggle('collapsed', !panelOpen);
  document.getElementById('btnPanel').textContent = panelOpen ? 'Hide Panel' : 'Show Panel';
};

// ── Theme color fix: replace CSS var refs in SVG fills ────────────────────────
// SVG fill="var(...)" doesn't work cross-browser; compute and apply on load.

function resolveColor(varName) {
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

function applySVGColors() {
  const colorMap = {
    'var(--node-cli)':  resolveColor('--node-cli'),
    'var(--node-api)':  resolveColor('--node-api'),
    'var(--node-core)': resolveColor('--node-core'),
    'var(--node-tool)': resolveColor('--node-tool'),
    'var(--node-ext)':  resolveColor('--node-ext'),
    'var(--node-sec)':  resolveColor('--node-sec'),
    'var(--border-hi)': resolveColor('--border-hi'),
    'var(--flow-color)':resolveColor('--flow-color'),
  };
  document.querySelectorAll('.node-bg').forEach(r => {
    const fill = r.getAttribute('fill');
    if (colorMap[fill]) r.setAttribute('fill', colorMap[fill]);
  });
  document.querySelectorAll('.edge.primary').forEach(e => {
    e.setAttribute('stroke', colorMap['var(--flow-color)'] || '#58a6ff');
  });
  // Fix arrowhead colors
  document.querySelectorAll('marker polygon').forEach(p => {
    const fill = p.getAttribute('fill');
    if (colorMap[fill]) p.setAttribute('fill', colorMap[fill]);
  });
}
applySVGColors();

// Re-apply if system theme changes
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySVGColors);
</script>
